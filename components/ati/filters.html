<div class="small-vertical-spacing hideInPrint">
    <div class="selection-group">
        <div class="col-sm-7 green-info-area">
            <div class="row small-vertical-spacing" ng-if="model.availableGroupSets.length > 0">
                <div class="col-sm-3">
                    {{ model.selectedMenu.thematicArea | translate}}
                </div>
                <div class="col-sm-9">
                    <ui-select ng-model="model.selectedGroupSet"
                            theme="select2"
                            style="width:100%;"
                            on-select="applyGroupSetFilter()">
                        <ui-select-match allow-clear="true" class="form-control-ui-select"
                                        placeholder="{{'all' | translate}}">
                            {{$select.selected.displayName}}
                        </ui-select-match>

                        <ui-select-choices repeat="gs in model.availableGroupSets | orderBy:'displayName' | filter:$select.search">
                            <span ng-bind-html="gs.displayName | highlight:$select.search"></span>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>

            <div class="row small-vertical-spacing">
                <div class="col-sm-3">
                    {{ model.selectedMenu.displayName | translate}}
                </div>
                <div class="col-sm-9">
                    <ui-select ng-model="model.selectedDataElementGroup"
                               theme="select2"
                               style="width:100%;">
                        <ui-select-match allow-clear="true" class="form-control-ui-select" 
                            placeholder="{{model.dataElementGroups && model.dataElementGroups.length > 0 ? 'all' : 'empty'| translate}}">
                                {{$select.selected.displayName|| $select.selected}}
                        </ui-select-match>
                        <ui-select-choices repeat="degs in model.dataElementGroups | orderBy:'displayName' | filter: $select.search | limitTo:maxOptionSize">
                            <span ng-bind-html="degs.displayName | highlight: $select.search"></span>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="row vertical-spacing pull-right">
                <div class="col-sm-12">
                    <button type="button"
                            class="btn btn-primary"
                            ng-click="getAnalyticsData()">
                        {{'display_report'| translate}}
                    </button>
                </div>
            </div>
        </div>
        <div class="col-sm-5 blue-info-area add-small-left-padding">
            <div ng-include="'views/report-filter/report-filters.html'"></div>
        </div>
    </div>
</div>
