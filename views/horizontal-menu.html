<div class="row">
  <div class="col-sm-12">
    <div equal-height-nav-tabs>
      <tabset id="ndpTabSet" justified="true">
        <tab class="{{getMenuStyle(horizontalMenu)}}"
          ng-repeat="horizontalMenu in model.horizontalMenus | orderBy:'order'" active="horizontalMenu.active"
          ng-click="resetView(horizontalMenu, $event)">
          <div ng-include="horizontalMenu.view"></div>
        </tab>
      </tabset>
    </div>
  </div>
</div>
